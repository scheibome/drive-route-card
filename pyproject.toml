[project]
name = "drive-route-card"
version = "0.1.0"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "PL", "RUF", "SIM", "UP", "W"]
ignore = [
  "E501",    # handled by the formatter
  "PLR2004", # magic values are fine in tests and status checks
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
known-third-party = ["homeassistant"]
combine-as-imports = true
